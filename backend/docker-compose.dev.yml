# Lokalna baza PostgreSQL do developmentu. Dane logowania pochodzą z pliku .env
# (docker compose czyta go automatycznie).
# Uruchomienie:  docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
